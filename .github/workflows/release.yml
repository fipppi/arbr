name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # single raw (non-archived) binary, Apple Silicon macOS only, so the
      # in-app updater (U) can download and swap it directly
      - name: Build binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/arbr .
          (cd dist && sha256sum ./* > checksums.txt)

      - name: Create GitHub release
        # manual (workflow_dispatch) runs from a branch are build-only smoke
        # tests: there is no tag, so publishing a release would fail
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
